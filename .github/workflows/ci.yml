name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run deps
      - run: npm run format:check
      - run: npm run typecheck
      # vitest.config.ts fija umbrales de cobertura medidos (unidad + banco); falla ante regresiones.
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Los números de README y docs/ salen de estos artefactos, no de la memoria de quien escribió la prosa:
      # se comprueban al final, contra la cobertura y las salidas de prueba que este mismo trabajo acaba de producir.
      - run: npm run results:doc
      - run: npm run docs:facts -- --check
      # El resumen de cobertura lo produce el reporter json-summary de vitest.config.ts: si falta, CI debe fallar.
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cobertura, path: coverage/coverage-summary.json, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: resultados, path: "test-results/**/*.json", if-no-files-found: ignore }
